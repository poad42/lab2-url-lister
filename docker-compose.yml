services:
  hadoop:
    build: .
    container_name: hadoop-ubuntu
    restart: unless-stopped
    hostname: localhost
    ports:
      - "9000:9000"
      - "9870:9870"
      - "8088:8088"
      - "8042:8042"
    volumes:
      - hadoop_data:/data/dfs
      - ./:/lab
    stdin_open: true
    tty: true

volumes:
  hadoop_data:
